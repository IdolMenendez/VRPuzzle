apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'tobservicelib-release', ext:'aar')
    implementation(name: 'PxrPlatform', ext:'aar')
    implementation(name: 'tob_api-release', ext:'aar')
    implementation(name: 'capturelib-release', ext:'aar')
    implementation(name: 'platformloader', ext:'aar')
    implementation(name: 'LoaderForUnitySDK_1_1_0', ext:'aar')
    implementation(name: 'CameraRenderingPlugin', ext:'aar')
    implementation project(':unityLibrary:xrmanifest.androidlib')
    implementation 'androidx.games:games-frame-pacing:1.10.0'
}

android {
    namespace "com.unity3d.player"
    ndkVersion "27.2.12479018"
    compileSdk 35
    buildToolsVersion = "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        consumerProguardFiles "proguard-unity.txt"
        versionName "1.0.0"
        minSdk 29
        targetSdk 35
        versionCode 2

        ndk {
            abiFilters "arm64-v8a"
            debugSymbolLevel "none"
        }

    }

    lint {
        abortOnError false
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp'] + unityStreamingAssets.tokenize(', ')
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}


// Native libraries were compiled from this same Unity export.
