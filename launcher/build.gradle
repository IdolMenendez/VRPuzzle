apply plugin: 'com.android.application'
apply from: 'setupSymbols.gradle'
apply from: '../shared/keepUnitySymbols.gradle'

dependencies {
    implementation project(':unityLibrary')
}

// Supply the platform/upload certificate through environment variables only.
def signingKeys = ['PICO_KEYSTORE_FILE', 'PICO_KEYSTORE_PASSWORD', 'PICO_KEY_ALIAS', 'PICO_KEY_PASSWORD']
def signingValues = signingKeys.collect { System.getenv(it) }
def releaseSigningReady = signingValues.every { it != null && !it.isEmpty() }
if (signingValues.any { it != null && !it.isEmpty() } && !releaseSigningReady) {
    throw new GradleException('Provide all four PICO signing environment variables, or none for an unsigned release.')
}

android {
    namespace "com.bytedance.personallypuzzled.xr"
    ndkVersion "27.2.12479018"
    compileSdk 35
    buildToolsVersion = "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.bytedance.personallypuzzled.xr"
        versionName "1.0.0"
        minSdk 29
        targetSdk 35
        versionCode 2

        ndk {
            abiFilters "arm64-v8a"
            debugSymbolLevel "none"
        }
    }

    lint {
        abortOnError false
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp'] + unityStreamingAssets.tokenize(', ')
    }

    packaging {
        jniLibs {
            // PersonallyPuzzledXR duplicate OpenXR loader fix
            pickFirsts.add("**/libopenxr_loader.so")
            useLegacyPackaging true
        }
    }

    signingConfigs {
        if (releaseSigningReady) {
            releaseUpload {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            jniDebuggable = true
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            if (releaseSigningReady) signingConfig signingConfigs.releaseUpload
        }
    }

    bundle {
        language {
            enableSplit = false
        }

        density {
            enableSplit = false
        }

        abi {
            enableSplit = true
        }

        texture {
            enableSplit = true
        }
    }
}
