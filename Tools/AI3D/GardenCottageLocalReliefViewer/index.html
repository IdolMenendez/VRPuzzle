<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Cottage V76 · Local Relief QA</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #e7cfb7; font-family: Inter, system-ui, sans-serif; }
      canvas { display: block; }
      .panel { position: fixed; left: 18px; top: 18px; z-index: 2; color: #4c3428;
        background: rgba(255,248,239,.9); border: 1px solid rgba(92,61,43,.18);
        border-radius: 14px; padding: 13px 15px; box-shadow: 0 8px 28px rgba(64,39,26,.12); }
      .panel h1 { margin: 0 0 5px; font-size: 15px; }
      .panel p { margin: 0 0 10px; max-width: 390px; font-size: 12px; line-height: 1.45; }
      button { border: 0; border-radius: 9px; padding: 8px 11px; margin-right: 7px;
        background: #76513c; color: white; cursor: pointer; }
      button.secondary { background: #d7b89f; color: #4c3428; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <section class="panel">
      <h1>Garden Cottage V76 · local semantic relief QA</h1>
      <p>Part_06 curved flowering vine and Part_07 sign/fence/flowerbed. Drag to orbit; wheel to inspect shallow depth.</p>
      <button id="reset">Reset view</button>
      <button id="export" class="secondary">Export QA group GLB</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
